name: Carrusel de anime

# Genera un carrusel a partir de una ficha de la carpeta caba-kami-stories/carruseles/.
# - Al subir una ficha nueva o cambiada: genera las diapositivas (sin mandarlas por Telegram).
# - A mano (Actions → Carrusel de anime → Run workflow): eliges la ficha y si se manda por Telegram.
on:
  push:
    paths:
      - "caba-kami-stories/carruseles/*.json"
      - "caba-kami-stories/src/carrusel/**"
      - ".github/workflows/carrusel.yml"
  workflow_dispatch:
    inputs:
      ficha:
        description: "Ficha, por ejemplo 2026-12-02-boticaria (sin .json)"
        required: true
      telegram:
        description: "Mandar el carrusel por Telegram"
        type: boolean
        default: true

permissions:
  contents: write   # para guardar las diapositivas en la rama "publico"

jobs:
  carrusel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caba-kami-stories
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund

      - name: Elegir fichas
        id: fichas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lista=carruseles/${{ inputs.ficha }}.json" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- carruseles/ 2>/dev/null | sed 's#^caba-kami-stories/##' | tr '\n' ' ')
            echo "lista=${CHANGED:-$(ls -t carruseles/*.json | head -1)}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar carrusel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.telegram }}" != "true" ]; then EXTRA="--sin-telegram"; fi
          for f in ${{ steps.fichas.outputs.lista }}; do
            [ -f "$f" ] && node src/carrusel/index.js "$f" $EXTRA
          done

      # Las diapositivas se guardan en la rama "publico" (carpeta carruseles/): desde ahí se revisan
      # y, más adelante, Instagram las descarga para publicarlas.
      - name: Guardar en la rama publico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SRC="$PWD"
          DEST="$RUNNER_TEMP/publico"
          # Si otra ejecución guardó algo a la vez, se vuelve a partir de lo último y se copia de nuevo
          # (en vez de rebasar un clon superficial, que puede fallar y perder la salida).
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf "$DEST"
            if ! git clone -q --depth 1 --branch publico "$REPO_URL" "$DEST" 2>/dev/null; then
              mkdir -p "$DEST" && git -C "$DEST" init -q -b publico && git -C "$DEST" remote add origin "$REPO_URL"
            fi
            for d in "$SRC"/out/carrusel-*/; do
              name=$(basename "$d" | sed 's/^carrusel-//')
              mkdir -p "$DEST/carruseles/$name"
              cp "$d"*.png "$d"*.jpg "$d"copy.txt "$DEST/carruseles/$name/"
              cp "$d"datos.json "$DEST/carruseles/$name/" 2>/dev/null || true
            done
            git -C "$DEST" add -A
            git -C "$DEST" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Carrusel ${{ steps.fichas.outputs.lista }}" || { echo "Sin cambios"; break; }
            git -C "$DEST" push -q origin publico && break
            echo "Otra ejecución guardó a la vez; reintento ($i)"
            sleep $((RANDOM % 8 + 3))
            [ "$i" = 8 ] && { echo "No se pudo guardar en publico"; exit 1; }
          done
